server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /tasks {
        proxy_pass http://backend:8000;
    }

    location /healthz {
        proxy_pass http://backend:8000;
    }

    location /weekly-summary {
        proxy_pass http://backend:8000;
    }

    location /historical-search {
        proxy_pass http://backend:8000;
    }
}